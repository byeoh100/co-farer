<!DOCTYPE html>
<!-- One theme: Midnight Basecamp (src/styles.css). -->
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ?v=2: new URLs so browsers that cached the old DeepSpace icon (Safari's
         favicon cache never re-checks) fetch the open-C icon. Bump when the icon changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#111111" />
    <title>Co-farer</title>
    <!-- First paint matches --cf-bg (no white flash before the CSS loads). -->
    <style>
      html { background-color: #111111; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
